name: DebtScope CI/CD Pipeline

on:
  push:
    branches: [ main, advancements, feat/** ]
  pull_request:
    branches: [ main, advancements ]

jobs:
  backend-test-suite:
    name: Backend & ML Engine Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Git & Lizard)
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Suite (Multi-Tenancy, 5D Engine, ML SZZ, Jira, Notion)
        run: |
          pytest backend/tests ml_engine/tests -v --durations=10

      - name: Run Grounded Copilot 42-Scenario Evaluation Benchmark
        run: |
          python evals/run_evals.py

  frontend-build:
    name: React 19 Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle (Vite)
        working-directory: frontend
        run: npm run build
