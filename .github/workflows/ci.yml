name: DebtScope CI/CD Pipeline

on:
  push:
    branches: [ main, advancements, fix/**, feat/** ]
  pull_request:
    branches: [ main, advancements ]

jobs:
  backend-test-suite:
    name: Backend & ML Engine Regression Suite (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: debtscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://postgres:postgres_ci_password@localhost:5432/debtscope_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Ephemeral Test Credentials
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV
          echo "TOKEN_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Install System Dependencies (Git & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt psycopg2-binary

      - name: Verify Alembic Migrations Lifecycle on Postgres 16 (Upgrade / Downgrade / Upgrade / Check)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

      - name: Run Full Pytest Regression Suite on Postgres 16
        run: |
          pytest backend/tests ml_engine/tests -v -m "not integration" --durations=10

      - name: Run Grounded Copilot Evaluation Benchmark
        run: |
          python evals/run_evals.py

  frontend-build:
    name: React 19 Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle (Vite)
        working-directory: frontend
        run: npm run build

  docker-build-and-smoke:
    name: Docker Build & Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Compose Images
        run: |
          docker compose build

      - name: Start Services via Docker Compose
        run: |
          docker compose up -d

      - name: Verify Service Health & Connectivity
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/health; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

          echo "Checking frontend HTTP response..."
          curl -s -I http://localhost:5173 | grep -E "HTTP/1.1 200|HTTP/1.1 304"

          echo "Verifying unauthenticated request to /api/v1/workspaces rejects with 401..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/workspaces)
          if [ "$HTTP_CODE" -ne 401 ] && [ "$HTTP_CODE" -ne 403 ]; then
            echo "Security verification failed: expected 401 or 403, got $HTTP_CODE"
            exit 1
          fi
          echo "Successfully verified 401/403 rejection on protected endpoint."

      - name: Teardown Services
        if: always()
        run: |
          docker compose down -v

  production-mode-security:
    name: Production-Mode Security Verification (ENVIRONMENT=production)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      DEV_SANDBOX_AUTH: "False"
      DATABASE_URL: sqlite:///:memory:
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      SESSION_SECRET_KEY: "prod-secret-session-key-0123456789abcdef0123456789abcdef"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Sandbox Login Rejected in Production (401/403)
        run: |
          pytest backend/tests/test_fail_closed_config.py -v

      - name: Verify Startup Refuses DEV_SANDBOX_AUTH in Production
        run: |
          python -c "
          import os, sys
          os.environ['ENVIRONMENT'] = 'production'
          os.environ['DEV_SANDBOX_AUTH'] = 'True'
          try:
              import backend.config
              print('ERROR: Startup succeeded with DEV_SANDBOX_AUTH=True in production!')
              sys.exit(1)
          except RuntimeError as e:
              print(f'SUCCESS: Startup refused DEV_SANDBOX_AUTH=True in production: {e}')
          "

      - name: Verify Secure + HttpOnly Cookie Flags in Production
        run: |
          pytest backend/tests/test_worker_mining.py -k "test_cookie_secure_samesite_behavior" -v

  gitleaks-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_IGNORE: "true"
          GITLEAKS_CONFIG: ".gitleaks.toml"
