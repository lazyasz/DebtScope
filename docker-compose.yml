services:
  postgres:
    image: postgres:16-alpine
    container_name: debtscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-debtscope}
      POSTGRES_USER: ${POSTGRES_USER:-debtscope_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"  # local access only; never expose the DB publicly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-debtscope_admin} -d ${POSTGRES_DB:-debtscope}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debtscope-net

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: debtscope-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-debtscope_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-debtscope}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      - DEV_SANDBOX_AUTH=${DEV_SANDBOX_AUTH:-False}
      - JIRA_SIMULATION_MODE=${JIRA_SIMULATION_MODE:-False}
      - NOTION_SIMULATION_MODE=${NOTION_SIMULATION_MODE:-False}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:5173"]}
      - JIRA_CLIENT_ID=${JIRA_CLIENT_ID:-}
      - JIRA_CLIENT_SECRET=${JIRA_CLIENT_SECRET:-}
      - NOTION_CLIENT_ID=${NOTION_CLIENT_ID:-}
      - NOTION_CLIENT_SECRET=${NOTION_CLIENT_SECRET:-}
      - COPILOT_LLM_PROVIDER=${COPILOT_LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - debtscope-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: debtscope-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - debtscope-net

volumes:
  postgres_data:
    driver: local

networks:
  debtscope-net:
    driver: bridge
